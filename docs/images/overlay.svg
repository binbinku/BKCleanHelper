<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="清洁遮罩示意图：安心擦一擦，45 秒后恢复，键盘与触摸板已暂停">
  <title>清洁遮罩示意图</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Helvetica, Arial, sans-serif; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
  <rect width="800" height="500" rx="18" fill="#0e0e0e"/>
  <rect x="0.5" y="0.5" width="799" height="499" rx="18" fill="none" stroke="#2c2c2e"/>

  <!-- keyboard symbol -->
  <g fill="none" stroke="#8e8e93" stroke-width="2.2" stroke-linecap="round">
    <rect x="377" y="56" width="46" height="31" rx="6"/>
    <path d="M389 79 H411"/>
  </g>
  <g fill="#8e8e93">
    <rect x="384" y="63" width="4" height="4" rx="1"/><rect x="391" y="63" width="4" height="4" rx="1"/>
    <rect x="398" y="63" width="4" height="4" rx="1"/><rect x="405" y="63" width="4" height="4" rx="1"/>
    <rect x="412" y="63" width="4" height="4" rx="1"/>
    <rect x="387" y="70" width="4" height="4" rx="1"/><rect x="394" y="70" width="4" height="4" rx="1"/>
    <rect x="401" y="70" width="4" height="4" rx="1"/><rect x="408" y="70" width="4" height="4" rx="1"/>
  </g>

  <text x="400" y="128" text-anchor="middle" font-size="20" font-weight="500" fill="#f5f5f7">安心擦一擦</text>

  <!-- countdown ring: 45 of 60 seconds remaining -->
  <circle cx="400" cy="240" r="96" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
  <path d="M400 144 A96 96 0 1 1 304 240" fill="none" stroke="#0a84ff" stroke-width="2.5" stroke-linecap="round"/>
  <text class="num" x="400" y="258" text-anchor="middle" font-size="76" font-weight="200" fill="#f5f5f7">45</text>
  <text x="400" y="284" text-anchor="middle" font-size="12" font-weight="500" fill="#98989d">秒后恢复</text>

  <text x="400" y="370" text-anchor="middle" font-size="17" font-weight="500" fill="#f5f5f7">键盘与触摸板已暂停</text>
  <text x="400" y="396" text-anchor="middle" font-size="13" fill="#98989d">包括外接键盘与鼠标 · 到时自动恢复</text>
  <text x="400" y="440" text-anchor="middle" font-size="12" font-weight="500" fill="#6e6e73">提前结束：按住 ⌃⌥⌘U 两秒</text>
</svg>
