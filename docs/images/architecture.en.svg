<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-label="Safety architecture: a separate input worker blocks input and keeps time, the main app drives the UI, and a watchdog kills the worker if heartbeats stop">
  <title>Safety architecture</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bg { fill: #f6f8fa; }
    .card { fill: #ffffff; stroke: #d0d7de; }
    .acard { fill: #ddf4ff; stroke: #0969da; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .a { fill: #0969da; }
    .g { fill: #1a7f37; }
    .ln { stroke: #8c959f; fill: none; }
    .rl { stroke: #cf222e; fill: none; }
    .r { fill: #cf222e; }
    .mk { fill: #8c959f; }
    .rmk { fill: #cf222e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #161b22; }
      .card { fill: #0d1117; stroke: #30363d; }
      .acard { fill: #121d2f; stroke: #4493f8; }
      .t { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .a { fill: #4493f8; }
      .g { fill: #3fb950; }
      .ln { stroke: #656c76; }
      .rl { stroke: #f85149; }
      .r { fill: #f85149; }
      .mk { fill: #656c76; }
      .rmk { fill: #f85149; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="rar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="rmk" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <rect class="bg" width="900" height="310" rx="16"/>

  <!-- input devices -->
  <rect class="card" x="30" y="80" width="170" height="110" rx="12" stroke-width="1.2"/>
  <text class="t" x="48" y="112" font-size="16" font-weight="700">Input devices</text>
  <text class="m" x="48" y="140" font-size="12.5">Keyboard · trackpad</text>
  <text class="m" x="48" y="162" font-size="12.5">External devices</text>
  <path class="ln" d="M202 135 H236" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- worker -->
  <rect class="acard" x="240" y="50" width="270" height="170" rx="12" stroke-width="1.6"/>
  <text class="a" x="258" y="84" font-size="17" font-weight="700">Input worker</text>
  <text class="m mono" x="258" y="104" font-size="12">--input-worker</text>
  <text class="t" x="258" y="134" font-size="12.5">· HID-level tap, first in line</text>
  <text class="t" x="258" y="156" font-size="12.5">· Continuous clock, counts sleep</text>
  <text class="t" x="258" y="178" font-size="12.5">· Watches ⌃⌥⌘U held for 2 s</text>
  <text class="t" x="258" y="200" font-size="12.5">· Expired or exited → pass through</text>

  <!-- main app -->
  <rect class="card" x="660" y="50" width="210" height="120" rx="12" stroke-width="1.2"/>
  <text class="t" x="678" y="84" font-size="17" font-weight="700">Main app</text>
  <text class="m" x="678" y="112" font-size="12.5">Menu bar · window</text>
  <text class="m" x="678" y="134" font-size="12.5">Full-screen overlay</text>
  <text class="m" x="678" y="156" font-size="12.5">Permission checks</text>

  <path class="ln" d="M658 95 H514" stroke-width="1.6" marker-end="url(#ar)"/>
  <text class="m" x="585" y="85" text-anchor="middle" font-size="11">launch · stop (stdin)</text>
  <path class="ln" d="M512 140 H656" stroke-width="1.6" marker-end="url(#ar)"/>
  <text class="m" x="585" y="158" text-anchor="middle" font-size="11">heartbeat (stdout)</text>

  <!-- watchdog -->
  <path class="ln" d="M765 170 V200" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect class="card" x="660" y="200" width="210" height="88" rx="12" stroke-width="1.2"/>
  <text class="t" x="678" y="228" font-size="15" font-weight="700">Watchdog</text>
  <text class="m" x="678" y="252" font-size="12.5">No heartbeat for 2 s,</text>
  <text class="m" x="678" y="272" font-size="12.5">or past 64 s → kill worker</text>
  <path class="rl" d="M658 244 H375 V224" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#rar)"/>
  <text class="r" x="520" y="236" text-anchor="middle" font-size="12" font-weight="600">force-kill</text>

  <!-- note -->
  <circle class="g" cx="36" cy="251" r="4"/>
  <text class="m" x="48" y="256" font-size="13">When the worker exits, macOS removes</text>
  <text class="m" x="48" y="278" font-size="13">its event tap — input is back at once.</text>
</svg>
